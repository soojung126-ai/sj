<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>현푸드랩 · 레시피에서 제품까지, 곁에서 함께</title>
  <meta name="description" content="처음이라 막막한 제품화, 첫 배합부터 출시까지 한 단계씩 같이 가요. 레시피 제품화 · 1회 자문 · 월 자문." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2.0.4/fonts/static/woff2/SUITE.css" />
  <link rel="stylesheet" href="green.css" />
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="#top">· <span data-text="nameEn"></span></a>
    <div class="nav-pill">
      <a class="active" href="#top">홈</a>
      <a href="#cases">사례</a>
      <a href="#services">할 수 있는 일</a>
      <a href="#contact">연락하기</a>
    </div>
    <a class="nav-cta" href="#contact">상담 문의</a>
  </nav>

  <header class="hero" id="top">
    <p class="hero-tag"><span data-text="nameEn"></span><span class="hero-tag-sub"> — FOOD PRODUCT DEVELOPMENT &amp; CONSULTING</span></p>

    <div class="wordmark-row">
      <h1 class="wordmark" data-text="name"></h1>
      <!-- 설계도 느낌의 병 도면 (장식) -->
      <svg class="blueprint" viewBox="0 0 260 210" aria-hidden="true">
        <defs>
          <pattern id="bp-grid" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M10 0H0V10" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.22" />
          </pattern>
          <marker id="bp-arrow" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0 0L6 3L0 6z" fill="currentColor" />
          </marker>
        </defs>
        <rect x="1" y="1" width="258" height="208" rx="16" fill="url(#bp-grid)" stroke="currentColor" stroke-dasharray="4 3" />
        <g fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="96" y="40" width="58" height="16" rx="3" />
          <path d="M102 56v4c-12 2-20 8-20 18v82c0 7 5 12 12 12h62c7 0 12-5 12-12V78c0-10-8-16-20-18v-4" />
          <rect x="82" y="96" width="86" height="42" stroke-dasharray="3 3" />
        </g>
        <g stroke="currentColor" stroke-width="0.8" opacity="0.7">
          <line x1="125" y1="30" x2="125" y2="182" stroke-dasharray="8 3 2 3" />
          <line x1="82" y1="28" x2="82" y2="74" />
          <line x1="168" y1="28" x2="168" y2="74" />
          <line x1="158" y1="40" x2="196" y2="40" />
          <line x1="174" y1="172" x2="196" y2="172" />
        </g>
        <g stroke="currentColor" stroke-width="1" marker-start="url(#bp-arrow)" marker-end="url(#bp-arrow)">
          <line x1="86" y1="30" x2="164" y2="30" />
          <line x1="192" y1="44" x2="192" y2="168" />
        </g>
        <g stroke="currentColor" stroke-width="0.8" fill="none">
          <path d="M90 117H58l-6 -6" />
          <path d="M100 47H58l-6 6" />
        </g>
        <g fill="currentColor" font-size="10" font-weight="800" letter-spacing="0.06em">
          <text x="125" y="23" text-anchor="middle">Ø 86</text>
          <text x="200" y="110">H 132</text>
          <text x="14" y="113">라벨</text>
          <text x="14" y="58">뚜껑</text>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="1">
          <rect x="176" y="182" width="72" height="18" rx="3" />
        </g>
        <text x="212" y="194.5" fill="currentColor" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">HFL · 배합 설계</text>
      </svg>
    </div>

    <div class="steps" aria-label="제품이 되는 과정">
      <div class="sticker sticker-a">
        <span class="sticker-label">STEP 01</span>
        <span class="sticker-big">레시피</span>
        <span class="sticker-small">매장의 그 맛 그대로</span>
      </div>
      <div class="sticker sticker-c">
        <span class="sticker-label">STEP 02</span>
        <span class="sticker-big">배합 설계</span>
        <span class="sticker-small">계량하고 표준화해 시제품까지</span>
      </div>
      <div class="sticker sticker-b">
        <span class="sticker-label">STEP 03</span>
        <span class="sticker-big">제품</span>
        <span class="sticker-small">선반 위에 올라가기까지</span>
      </div>
    </div>

    <div class="hero-bottom">
      <div>
        <p class="headline" data-text="headline"></p>
        <p class="intro" data-text="intro"></p>
      </div>
      <div class="hero-meta">
        <p class="meta-title" data-text="role"></p>
        <p class="meta-sub">레시피 제품화 · 1회 자문 · 월 자문</p>
      </div>
    </div>
  </header>

  <main class="panel">
    <section class="section" id="cases">
      <p class="kicker">CASES</p>
      <h2>이렇게 만들었어요</h2>
      <div class="cards" id="case-list"></div>
    </section>

    <section class="section" id="services">
      <p class="kicker">SERVICES</p>
      <h2>할 수 있는 일</h2>
      <div class="services" id="service-list"></div>
    </section>

    <section class="contact" id="contact">
      <p class="kicker">CONTACT</p>
      <h2>편하게 연락 주세요</h2>
      <p class="lead">어떤 제품을 만들고 싶은지 한 줄만 알려주셔도 괜찮아요.</p>
      <div class="contact-buttons">
        <a class="btn btn-kakao" id="btn-kakao" target="_blank" rel="noopener">카카오톡으로 연락하기</a>
        <a class="btn btn-outline" id="btn-email">이메일 보내기</a>
      </div>

      <form id="inquiry-form" class="form" novalidate>
        <h3>문의 남기기</h3>
        <label>
          <span>이름 또는 상호</span>
          <input name="name" type="text" maxlength="100" required placeholder="예: 오늘반찬 김사장" />
        </label>
        <label>
          <span>연락처</span>
          <input name="contact" type="text" maxlength="200" required placeholder="이메일이나 전화번호" />
        </label>
        <label>
          <span>원하는 서비스</span>
          <select name="service" required>
            <option value="">골라주세요</option>
          </select>
        </label>
        <label>
          <span>어떤 제품을 만들고 싶으세요?</span>
          <textarea name="description" rows="4" maxlength="2000" required placeholder="예: 매장 깻잎장아찌를 병 제품으로 팔고 싶어요"></textarea>
        </label>
        <input name="website" type="text" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button class="btn btn-primary" type="submit">문의 보내기</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </section>

    <footer class="footer">© <span data-text="name"></span> · <span class="footer-en" data-text="nameEn"></span></footer>
  </main>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
